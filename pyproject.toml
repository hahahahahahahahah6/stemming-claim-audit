[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stemming-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for suffix stripping"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
stemming-claim-audit = "stemming_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["stemming_claim_audit*", "tests"]
